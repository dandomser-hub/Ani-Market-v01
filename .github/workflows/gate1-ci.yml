name: Gate 1 MVP CI

on:
  push:
    branches:
      - feature/gate1-expanded-mvp
  pull_request:
    branches:
      - ani-to-mvp-01

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 regression contract
        run: npm run qa:gate1

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
